<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decomposing the 275 Elo top 100 gap</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 color:#312e2b;-webkit-font-smoothing:antialiased}
.card{background:#fff;border-radius:5px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.20)}
.hd{background:#f1f1f1;padding:12px 16px;border-bottom:1px solid #e4e4e2}
.hd h1{margin:0;font:700 17px/1.25 inherit;color:#312e2b}
.hd p{margin:3px 0 0;font-size:13px;color:#8b8987}
.bd{padding:14px 16px 8px}
.legend{font-size:12px;color:#7a7a76;margin:0 0 10px}
.legend span{margin-right:16px;white-space:nowrap;display:inline-block}
.ft{background:#f7f7f7;border-top:1px solid #e4e4e2;padding:10px 16px;font-size:12px;
 line-height:1.5;color:#7a7a76}
.ft a{color:#6a9b3f;text-decoration:none;font-weight:600}
.ft a:hover{text-decoration:underline}
@media(max-width:520px){.hd h1{font-size:15px}.bd{padding:12px}.legend,.ft{font-size:11px}}

.bars{margin-top:2px}
.bar{margin-bottom:20px}
.bar:last-child{margin-bottom:0}
.bhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:12px}
.bhead span{font-size:14px;color:#312e2b}
.bhead b{font:700 28px inherit;color:#312e2b;line-height:1}
.track{height:13px;background:#e9e9e7;border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.22,.8,.3,1)}
.bar small{display:block;font-size:12px;color:#8b8987;margin-top:6px}
</style></head><body><div class="card">
<div class="hd"><h1>Decomposing the 275 Elo top 100 gap</h1>
<p>Figure 5 &middot; 1 in 9, a data story about women in chess</p></div>
<div class="bd"><div class="bars">
  <div class="bar">
    <div class="bhead"><span>Attributable to sample size alone</span><b>50%</b></div>
    <div class="track"><i data-w="50" style="background:#769656"></i></div>
    <small>136 Elo points</small>
  </div>
  <div class="bar">
    <div class="bhead"><span>Attributable to distribution shape</span><b>50%</b></div>
    <div class="track"><i data-w="50" style="background:#b85c74"></i></div>
    <small>139 Elo points</small>
  </div>
</div></div>
<div class="ft"><a href="https://anp-exe.github.io/women-in-chess-analysis/" target="_blank" rel="noopener">Full write up &rarr;</a></div>
</div>
<script>
setTimeout(function(){
  document.querySelectorAll('.track i').forEach(function(el){ el.style.width = el.dataset.w + '%'; });
}, 250);

(function(){
 if(window.parent===window) return;
 var id=(location.search.match(/[?&]id=([^&]+)/)||[])[1]; if(!id) return;
 var last=0;
 function send(){
  var c=document.querySelector('.card');
  var h=Math.ceil(c?c.getBoundingClientRect().height:document.body.scrollHeight);
  if(h&&h!==last){ last=h; window.parent.postMessage({id:id,frameHeight:h},'*'); }
 }
 window.addEventListener('load',send); window.addEventListener('resize',send);
 if(window.ResizeObserver){ new ResizeObserver(send).observe(document.querySelector('.card')||document.body); }
 setTimeout(send,60); setTimeout(send,400);
})();

</script>
</body></html>
