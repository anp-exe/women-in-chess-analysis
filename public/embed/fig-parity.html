<script>
var D = __D__;
var W = '#B85C74', G = '#8B8987', INK = '#312E2B', GRID = '#E9E9E7', MUTED = '#7A7A76';
var PARITY = 50, OBS_MS = 5000, PROJ_MS = 11000;

function ym(m){ var p = m.split('-'); return +p[0] + (+p[1] - 1) / 12; }
var obs = D.observed.map(function(r){ return {x: ym(r.month), share: r.share}; });
var lastShare = D.share_last, slope = D.slope_recent;
var lastX = obs[obs.length - 1].x, lastYear = Math.floor(lastX);
var yearsToParity = Math.ceil((PARITY - lastShare) / slope);
var parityYear = lastYear + yearsToParity;

var rows = obs.slice();
for (var y = 0; y <= yearsToParity; y++)
  rows.push({x: lastYear + y + 0.25, proj: Math.min(PARITY, lastShare + slope * y)});
var nObs = obs.length, total = rows.length;

function yearStep(s){ return s<=20?5 : s<=60?10 : s<=150?25 : s<=350?50 : 100; }
function shareTicks(lo, hi){
  var step = hi-lo<=6 ? 1 : hi-lo<=16 ? 5 : 10, out = [];
  for (var v = Math.ceil(lo/step)*step; v <= hi; v += step) out.push(v);
  return out;
}
function frameAt(ms){
  if (ms < OBS_MS) return Math.round(ms / OBS_MS * nObs);
  return Math.min(total, nObs + Math.round((ms - OBS_MS) / PROJ_MS * (total - nObs)));
}
function msAt(f){
  return f <= nObs ? f / nObs * OBS_MS
                   : OBS_MS + (f - nObs) / (total - nObs) * PROJ_MS;
}

var svg = document.getElementById('plot');
var VB = {w: 760, h: 320, ml: 54, mr: 16, mt: 16, mb: 34};
svg.setAttribute('viewBox', '0 0 ' + VB.w + ' ' + VB.h);

var view = 'parity', frame = total, playing = false, rafId = null;

function draw(){
  var shown = rows.slice(0, Math.max(2, frame));
  var head = shown[shown.length - 1];
  var headShare = head.proj != null ? head.proj : head.share;
  var headYear = Math.floor(head.x);
  var u = Math.min(1, Math.max(0, (headYear - lastYear) / (parityYear - lastYear)));

  var x0 = obs[0].x, x1, yLo, yHi, plotted;
  if (view === 'observed'){
    x1 = lastX; yLo = 9; yHi = 11; plotted = obs;
  } else {
    x1 = Math.round(lastYear + 5 + u * (parityYear - lastYear - 5)) + 0.25;
    yLo = 8 * (1 - u); yHi = 12 + (55 - 12) * u; plotted = shown;
  }
  var X = function(v){ return VB.ml + (v - x0) / (x1 - x0) * (VB.w - VB.ml - VB.mr); };
  var Y = function(v){ return (VB.h - VB.mb) - (v - yLo) / (yHi - yLo) * (VB.h - VB.mb - VB.mt); };

  var yt = view === 'observed' ? [9, 9.5, 10, 10.5, 11] : shareTicks(yLo, yHi);
  var step = yearStep(x1 - x0), xt = [];
  for (var yv = Math.ceil(x0 / step) * step; yv <= x1; yv += step) xt.push(yv);
  /* the run starts at 2015 but the first round tick can be a century away,
     so label the start unless a tick already sits near it */
  var start = Math.ceil(x0);
  if (!xt.length || xt[0] - start > step * 0.35) xt.unshift(start);

  var s = '';
  yt.forEach(function(v){
    s += '<line x1="' + VB.ml + '" x2="' + (VB.w - VB.mr) + '" y1="' + Y(v).toFixed(1) +
         '" y2="' + Y(v).toFixed(1) + '" stroke="' + GRID + '"/>';
    s += '<text x="' + (VB.ml - 8) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="' +
         MUTED + '">' + (v % 1 ? v.toFixed(1) : v) + '%</text>';
  });
  xt.forEach(function(v){
    s += '<text x="' + X(v).toFixed(1) + '" y="' + (VB.h - VB.mb + 18) + '" text-anchor="middle" font-size="11" fill="' +
         MUTED + '">' + v + '</text>';
  });

  if (yHi >= PARITY){
    s += '<line x1="' + VB.ml + '" x2="' + (VB.w - VB.mr) + '" y1="' + Y(PARITY).toFixed(1) + '" y2="' +
         Y(PARITY).toFixed(1) + '" stroke="' + INK + '" stroke-dasharray="4 4" opacity="0.5"/>';
    s += '<text x="' + (VB.ml + 6) + '" y="' + (Y(PARITY) - 6).toFixed(1) +
         '" font-size="11" fill="' + INK + '" opacity="0.7">Parity, 50 percent</text>';
  }

  function path(pts){
    return pts.length < 2 ? '' : 'M' + pts.map(function(p){ return X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' L');
  }
  var obsPts = plotted.filter(function(r){ return r.share != null; }).map(function(r){ return [r.x, r.share]; });
  var projPts = plotted.filter(function(r){ return r.proj != null; }).map(function(r){ return [r.x, r.proj]; });
  if (projPts.length) s += '<path d="' + path(projPts) + '" fill="none" stroke="' + G + '" stroke-width="2" stroke-dasharray="7 5"/>';
  if (obsPts.length)  s += '<path d="' + path(obsPts) + '" fill="none" stroke="' + W + '" stroke-width="2.6"/>';

  if (view === 'parity'){
    s += '<circle cx="' + X(head.x).toFixed(1) + '" cy="' + Y(headShare).toFixed(1) + '" r="4.5" fill="' + W + '"/>';
    s += '<text x="' + (X(head.x) - 9).toFixed(1) + '" y="' + (Y(headShare) - 12).toFixed(1) +
         '" text-anchor="end" font-size="13" font-weight="600" fill="' + W +
         '" stroke="#ffffff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">' + headYear + '</text>';
  }
  svg.innerHTML = s;

  document.getElementById('yr').textContent = view === 'observed' ? lastYear : headYear;
  var hs = view === 'observed' ? lastShare : headShare;
  document.getElementById('sh').textContent =
    hs.toFixed(1) + ' percent women' + (hs >= PARITY ? ', parity' : ', ' + ((100 - hs) / hs).toFixed(1) + ' men per woman');
  var sl = document.getElementById('sl');
  if (+sl.value !== frame) sl.value = frame;
}

function stop(){ playing = false; if (rafId) cancelAnimationFrame(rafId); document.getElementById('pp').textContent = 'Play'; }
function play(){
  if (view !== 'parity') return;
  if (frame >= total) frame = 0;
  playing = true;
  document.getElementById('pp').textContent = 'Pause';
  var started = performance.now() - msAt(frame);
  (function tick(now){
    if (!playing) return;
    var next = frameAt(now - started);
    if (next !== frame){ frame = next; draw(); }
    if (next >= total){ stop(); return; }
    rafId = requestAnimationFrame(tick);
  })(performance.now());
}

document.getElementById('pp').onclick = function(){ playing ? stop() : play(); };
document.getElementById('sl').max = total;
document.getElementById('sl').oninput = function(){ stop(); frame = +this.value; draw(); };
[['vp','parity'],['vo','observed']].forEach(function(p){
  document.getElementById(p[0]).onclick = function(){
    stop(); view = p[1];
    document.getElementById('vp').className = view === 'parity' ? 'on' : '';
    document.getElementById('vo').className = view === 'observed' ? 'on' : '';
    document.getElementById('ctl').style.display = view === 'parity' ? '' : 'none';
    if (view === 'parity') frame = total;
    draw();
  };
});

draw();
if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
  setTimeout(function(){ frame = 0; draw(); play(); }, 500);
}
</script>
