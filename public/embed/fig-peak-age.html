(function(){
 var p=document.querySelector('.plot'); if(!p) return;
 var tip=document.createElement('div'); tip.className='tip'; p.appendChild(tip);
 p.querySelectorAll('svg rect > title, svg circle > title').forEach(function(t){
  var o=t.parentNode; o.setAttribute('data-tip',t.textContent); o.removeChild(t); });
 function show(e,cx,cy){
  var t=e.target.closest('[data-tip]'); if(!t){ tip.style.opacity=0; return; }
  var r=p.getBoundingClientRect();
  tip.textContent=t.getAttribute('data-tip');
  tip.style.left=(cx-r.left)+'px'; tip.style.top=(cy-r.top)+'px'; tip.style.opacity=1;
  var s=t.ownerSVGElement, g=s&&s.querySelector('.guide');
  if(g){ var b=t.getBBox(), x=b.x+b.width/2;
   g.setAttribute('x1',x); g.setAttribute('x2',x); g.setAttribute('opacity','0.35'); }
 }
 p.addEventListener('mousemove',function(e){ show(e,e.clientX,e.clientY); });
 p.addEventListener('touchstart',function(e){
  var t=e.touches[0]; var el=document.elementFromPoint(t.clientX,t.clientY);
  show({target:el||e.target},t.clientX,t.clientY); },{passive:true});
 p.addEventListener('mouseleave',function(){ tip.style.opacity=0;
  p.querySelectorAll('.guide').forEach(function(g){ g.setAttribute('opacity','0'); }); });
})();

/* Report height to the host page, same message shape chess.com's own diagram
   embeds use, so a fixed iframe height is never wrong at any column width. */
(function(){
 if(window.parent===window) return;
 var id=(location.search.match(/[?&]id=([^&]+)/)||[])[1];
 if(!id) return;
 var last=0;
 function send(){
  var c=document.querySelector('.card');
  var h=Math.ceil(c?c.getBoundingClientRect().height:document.body.scrollHeight);
  if(h&&h!==last){ last=h; window.parent.postMessage({id:id,frameHeight:h},'*'); }
 }
 window.addEventListener('load',send);
 window.addEventListener('resize',send);
 if(window.ResizeObserver){ new ResizeObserver(send).observe(document.querySelector('.card')||document.body); }
 setTimeout(send,60); setTimeout(send,400);
})();
